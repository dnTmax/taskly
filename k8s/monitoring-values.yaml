prometheus:
  prometheusSpec:
    # Prendre en compte les ServiceMonitor et regles de tous les namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 12h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

# Composants gérés par AWS sur EKS : inutiles ici
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
